<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="437" viewBox="0 0 1000 437">
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#87929c"/></marker></defs>
  <rect width="1000" height="437" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#25313c" font-size="18">
    <text x="50" y="30" font-size="20" font-weight="bold">Read finishes before the write</text>
    <text x="535" y="30" font-size="20" font-weight="bold">Write occurs with the old read pending</text>
    <path d="M490 48 V383" stroke="#d7dce0"/>
    <text x="117" y="71" text-anchor="middle">Reader</text><text x="335" y="71" text-anchor="middle">Writer</text>
    <text x="602" y="71" text-anchor="middle">Reader</text><text x="820" y="71" text-anchor="middle">Writer</text>
    <g stroke="#87929c" stroke-width="1.4" marker-end="url(#arrow)">
      <path d="M117 85 V309"/><path d="M335 85 V309"/>
      <path d="M602 85 V309"/><path d="M820 85 V309"/>
    </g>
    <g fill="#21658b">
      <circle cx="117" cy="108" r="5"/><circle cx="117" cy="163" r="5"/>
      <circle cx="602" cy="108" r="5"/><circle cx="602" cy="260" r="5"/>
    </g>
    <g fill="#6e7780">
      <circle cx="335" cy="203" r="5"/><circle cx="335" cy="260" r="5"/>
      <circle cx="820" cy="163" r="5"/><circle cx="820" cy="220" r="5"/>
    </g>
    <text x="132" y="113" font-size="17">issue read O</text>
    <text x="132" y="168" font-size="17">read completes</text>
    <text x="321" y="199" text-anchor="end" font-size="17">write O</text>
    <text x="321" y="256" text-anchor="end" font-size="17">store wait returns</text>
    <text x="617" y="113" font-size="17">issue read O</text>
    <text x="617" y="265" font-size="17">read completes</text>
    <text x="838" y="168" font-size="17" fill="#a54835">write O</text>
    <text x="838" y="216" font-size="16">store wait</text><text x="838" y="237" font-size="16">returns</text>
    <path d="M586 112 V254" stroke="#a54835" stroke-width="4"/>
    <path d="M592 163 H811" stroke="#a54835" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="700" y="190" text-anchor="middle" fill="#a54835" font-size="16">old read still outstanding</text>
    <path d="M45 329 H455 M532 329 H964" stroke="#8998a5"/>
    <text x="250" y="358" text-anchor="middle">exit: no pending read or store</text>
    <text x="748" y="358" text-anchor="middle">exit: no pending read or store</text>
    <text x="500" y="394" text-anchor="middle" font-size="17">Same exit state; different behavior inside the region.</text>
    <text x="500" y="425" text-anchor="middle" font-size="15" fill="#596671">Execution order runs downward. Abstract illustration; not a rescale-kernel witness.</text>
  </g>
</svg>
